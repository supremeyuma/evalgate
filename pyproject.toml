[project]
name = "evalgate"
version = "1.0.0"
description = "CI quality gate for LLM outputs: declarative eval suites, judges, and regression thresholds"
readme = "README.md"
authors = [
    { name = "supremeyuma", email = "37828971+supremeyuma@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "arq>=0.28.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "redis>=5.3.1",
    "rich>=15.0.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "typer>=0.29.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
evalgate = "evalgate.cli:app"

[project.urls]
Homepage = "https://github.com/supremeyuma/evalgate"
Repository = "https://github.com/supremeyuma/evalgate"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261111",
    "vcrpy>=9.4.2",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"scripts/**" = ["S101", "T201", "E501", "S603"]

[tool.ruff.lint.isort]
known-first-party = ["evalgate"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["arq.*", "vcr.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = [
    "integration: tests that need Postgres/Redis (docker) or other external services",
]

[tool.coverage.run]
source = ["evalgate"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
