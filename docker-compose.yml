name: evalgate

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evalgate
      POSTGRES_PASSWORD: evalgate
      POSTGRES_DB: evalgate
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalgate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["uvicorn", "evalgate.api.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      DATABASE_URL: postgresql+asyncpg://evalgate:evalgate@postgres:5432/evalgate
      REDIS_URL: redis://redis:6379/0
      EVALGATE_API_KEY: dev-key
      JUDGE_CACHE_BACKEND: postgres
      JUDGE_MODEL: gpt-4.1-mini
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: ["arq", "evalgate.worker.settings.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://evalgate:evalgate@postgres:5432/evalgate
      REDIS_URL: redis://redis:6379/0
      EVALGATE_MIGRATE: "0"
      JUDGE_CACHE_BACKEND: postgres
      JUDGE_MODEL: gpt-4.1-mini
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
