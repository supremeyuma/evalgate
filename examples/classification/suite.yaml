# Support intent classification — deterministic exact-match metric.
name: classification-intent-accuracy
model:
  provider: mock
  name: gpt-4.1-mini
  temperature: 0
  max_tokens: 16
prompt: prompts/classify.md
cases_file: datasets/intents.jsonl
metrics:
  - type: exact_match
    normalize: true
  - type: latency_ms
    max: 2000
limits:
  max_cost_usd: 0.10
  max_p95_latency_ms: 2000
regression:
  max_pass_rate_drop: 0.05
  min_cases: 10
